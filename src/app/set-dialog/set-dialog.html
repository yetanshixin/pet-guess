<h2 mat-dialog-title class="dialog-title">游戏设置</h2>

<mat-dialog-content class="set-dialog-content">
    <div class="setting-item">
        <mat-slide-toggle [(ngModel)]="currentSettings.easyModel" color="primary" matTooltip="答案只包含最终阶段的精灵，下一轮生效">
            简单模式
        </mat-slide-toggle>
    </div>
    <div class="setting-item">
        <mat-slide-toggle [(ngModel)]="currentSettings.showMoreNumInfo" color="primary">
            显示更多种族值信息
        </mat-slide-toggle>
    </div>
    <div class="setting-item">
        <mat-slide-toggle [(ngModel)]="currentSettings.showHeightAndWeight" color="primary">
            显示体型信息
        </mat-slide-toggle>
    </div>
    <div class="setting-item">
        <mat-slide-toggle [(ngModel)]="currentSettings.showEggAndSexInfo" color="primary">
            显示蛋组/性别比例信息
        </mat-slide-toggle>
    </div>
    <div class="setting-item">
        <mat-slide-toggle [(ngModel)]="currentSettings.showSArrow" color="primary">
            开启赛季箭头
        </mat-slide-toggle>
    </div>
    <div class="setting-item slider-item">
        <div class="slider-header">
            <span>猜测机会：</span>
            <span class="chance-value">{{ currentSettings.guessChance }} 次</span>
        </div>
        <mat-slider min="3" max="15" step="1" showTickMarks discrete color="primary">
            <input matSliderThumb [(ngModel)]="currentSettings.guessChance">
        </mat-slider>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-footer">
    <button mat-button (click)="cancel()">取消</button>
    <button mat-flat-button color="primary" (click)="save()">保存设置</button>
</mat-dialog-actions>
